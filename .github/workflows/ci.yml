name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build Docker image
        run: docker build --tag customer-spending-insights-dashboard:ci .
      - name: Run container smoke test
        run: |
          container_id=$(docker run --detach --publish 8080:8080 customer-spending-insights-dashboard:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://localhost:8080/ --output /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8080/config.json | grep -q '"mockApi":true'
          curl --fail --silent --show-error --head http://localhost:8080/mockServiceWorker.js | grep -qi '^Cache-Control: no-cache'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build GitHub Pages site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
